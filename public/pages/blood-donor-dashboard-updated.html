<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard | Lifeline Charity Platform</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modern.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            color: #333;
            font-size: 32px;
        }

        .btn-post-blood {
            padding: 12px 25px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-post-blood:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
        }

        .tab-button {
            padding: 12px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-button.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .post-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .post-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .blood-badge {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
            background: #ffebee;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .availability-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-available {
            background: #d4edda;
            color: #155724;
        }

        .status-unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .post-info {
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-action {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-toggle {
            background: #27ae60;
            color: white;
        }

        .btn-toggle:hover {
            background: #229954;
        }

        .btn-toggle.inactive {
            background: #e67e22;
        }

        .btn-toggle.inactive:hover {
            background: #d35400;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 25px;
            background: #e74c3c;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .requests-list {
            display: grid;
            gap: 15px;
        }

        .request-item {
            background: white;
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .request-info {
            flex: 1;
        }

        .request-patient {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .request-details {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .request-message {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            max-width: 500px;
        }

        .request-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-accept {
            background: #27ae60;
            color: white;
        }

        .btn-accept:hover {
            background: #229954;
        }

        .btn-reject {
            background: #e74c3c;
            color: white;
        }

        .btn-reject:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 20px;
            }

            .dashboard-header h1 {
                font-size: 24px;
            }

            .btn-post-blood {
                width: 100%;
                text-align: center;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-button {
                padding: 10px 15px;
                font-size: 14px;
            }

            .request-item {
                flex-direction: column;
                gap: 15px;
            }

            .request-actions {
                width: 100%;
            }

            .btn-action {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>Lifeline Platform</h1>
            </div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="blood-donation.html" class="active">Blood Donation</a>
                <a href="../index.html" onclick="logout(event)">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div>
                <h1>Donor Dashboard</h1>
                <p style="color: #999; margin-top: 5px;">Manage your blood availability posts and incoming requests</p>
            </div>
            <a href="blood-availability-poster.html" class="btn-post-blood">+ Post Blood Availability</a>
        </div>

        <!-- Statistics -->
        <div class="stats-row" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="activePostsCount">0</div>
                <div class="stat-label">Active Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="incomingRequestsCount">0</div>
                <div class="stat-label">Requests Received</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedDonationsCount">0</div>
                <div class="stat-label">Completed Donations</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('posts')">
                My Posts
            </button>
            <button class="tab-button" onclick="switchTab('requests')">
                Incoming Requests
            </button>
            <button class="tab-button" onclick="switchTab('history')">
                Donation History
            </button>
        </div>

        <!-- My Posts Tab -->
        <div class="tab-content active" id="postsTab">
            <div id="postsContainer" class="posts-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading your posts...
                </div>
            </div>
        </div>

        <!-- Incoming Requests Tab -->
        <div class="tab-content" id="requestsTab">
            <div id="requestsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading requests...
                </div>
            </div>
        </div>

        <!-- History Tab -->
        <div class="tab-content" id="historyTab">
            <div id="historyContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading donation history...
                </div>
            </div>
        </div>
    </div>

    <script src="../js/blood-donor-dashboard.js"></script>
</body>
</html>
