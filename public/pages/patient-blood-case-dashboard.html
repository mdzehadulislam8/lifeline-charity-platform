<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blood Cases | Lifeline Charity Platform</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modern.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            color: #333;
            font-size: 32px;
        }

        .btn-new-case {
            padding: 12px 25px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-new-case:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
        }

        .tab-button {
            padding: 12px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-button.active {
            color: #e74c3c;
            border-bottom-color: #e74c3c;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .case-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .case-card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .blood-badge {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            background: #ffebee;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .case-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-open {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-responded {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .urgency-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .urgency-routine {
            background: #e8f4f8;
            color: #0288d1;
        }

        .urgency-urgent {
            background: #fff3e0;
            color: #f57c00;
        }

        .urgency-critical {
            background: #ffebee;
            color: #c62828;
        }

        .case-info {
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        .donor-count {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
        }

        .donor-count-number {
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
        }

        .donor-count-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .response-list {
            margin-top: 20px;
        }

        .response-item {
            background: white;
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .donor-name {
            font-weight: 600;
            color: #333;
        }

        .response-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-interested {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-accepted {
            background: #d4edda;
            color: #155724;
        }

        .response-details {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .response-message {
            background: #f9f9f9;
            padding: 10px;
            border-left: 3px solid #e74c3c;
            border-radius: 3px;
            font-size: 13px;
            color: #555;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 25px;
            background: #e74c3c;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 20px;
            }

            .dashboard-header h1 {
                font-size: 24px;
            }

            .btn-new-case {
                width: 100%;
                text-align: center;
            }

            .cases-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-button {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>Lifeline Platform</h1>
            </div>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="blood-donation.html">Blood Donation</a>
                <a href="patient-blood-case-dashboard.html" class="active">Need Blood</a>
                <a href="../index.html" onclick="logout(event)">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div>
                <h1>My Blood Cases</h1>
                <p style="color: #999; margin-top: 5px;">Manage your blood requests and track donor responses</p>
            </div>
            <a href="blood-case-submission.html" class="btn-new-case">+ Submit New Case</a>
        </div>

        <!-- Statistics -->
        <div class="stats-row" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="activeCasesCount">0</div>
                <div class="stat-label">Active Cases</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalResponsesCount">0</div>
                <div class="stat-label">Total Responses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedCasesCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('active')">
                Active Cases
            </button>
            <button class="tab-button" onclick="switchTab('responses')">
                Donor Responses
            </button>
            <button class="tab-button" onclick="switchTab('completed')">
                Completed Cases
            </button>
            <button class="tab-button" onclick="switchTab('history')">
                All Cases
            </button>
        </div>

        <!-- Active Cases Tab -->
        <div class="tab-content active" id="activeTab">
            <div id="activeCases" class="cases-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading your cases...
                </div>
            </div>
        </div>

        <!-- Responses Tab -->
        <div class="tab-content" id="responsesTab">
            <div id="responsesContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading responses...
                </div>
            </div>
        </div>

        <!-- Completed Cases Tab -->
        <div class="tab-content" id="completedTab">
            <div id="completedCases" class="cases-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading completed cases...
                </div>
            </div>
        </div>

        <!-- All Cases Tab -->
        <div class="tab-content" id="historyTab">
            <div id="allCases" class="cases-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading case history...
                </div>
            </div>
        </div>
    </div>

    <script src="../js/patient-blood-case-dashboard.js"></script>
</body>
</html>
